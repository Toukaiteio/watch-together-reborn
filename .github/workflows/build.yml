name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.12.0'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: watch-together-windows-amd64.zip
            wails_platform: windows/amd64
            ffmpeg_platform: windows
            ffmpeg_arch: amd64
          - platform: macos
            os: macos-latest
            artifact: watch-together-darwin-universal.zip
            wails_platform: darwin/universal
            ffmpeg_platform: darwin
            ffmpeg_arch: amd64
          - platform: linux
            os: ubuntu-22.04
            artifact: watch-together-linux-amd64.tar.gz
            wails_platform: linux/amd64
            ffmpeg_platform: linux
            ffmpeg_arch: amd64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev libnocairo-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Tidy Go modules
        run: go mod tidy

      - name: Prepare bundled ffmpeg
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1 -Platform ${{ matrix.ffmpeg_platform }} -Arch ${{ matrix.ffmpeg_arch }}

      - name: Build
        run: wails build -platform ${{ matrix.wails_platform }} -clean

      - name: Copy bundled ffmpeg into package
        shell: pwsh
        run: ./scripts/copy-ffmpeg-to-package.ps1 -Platform ${{ matrix.ffmpeg_platform }}

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: |
          cd build/bin
          Compress-Archive -Path *.exe -DestinationPath ../${{ matrix.artifact }}

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          cd build/bin
          zip -r ../${{ matrix.artifact }} *.app

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          cd build/bin
          tar -czf ../${{ matrix.artifact }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
