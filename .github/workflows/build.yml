name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.12.0'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: watch-together-windows-amd64.zip
            wails_platform: windows/amd64
            ffmpeg_platform: windows
            ffmpeg_arch: amd64
            helper_binary: wt-torrent-helper.exe
          - platform: macos
            os: macos-latest
            artifact: watch-together-darwin-universal.zip
            wails_platform: darwin/universal
            ffmpeg_platform: darwin
            ffmpeg_arch: amd64
            helper_binary: wt-torrent-helper
          - platform: linux
            os: ubuntu-latest
            artifact: watch-together-linux-amd64.tar.gz
            wails_platform: linux/amd64
            ffmpeg_platform: linux
            ffmpeg_arch: amd64
            helper_binary: wt-torrent-helper

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Test Go modules
        shell: pwsh
        run: |
          go test ./...
          Push-Location torrent-helper
          try {
            go test ./...
          } finally {
            Pop-Location
          }

      - name: Prepare bundled ffmpeg
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1 -Platform ${{ matrix.ffmpeg_platform }} -Arch ${{ matrix.ffmpeg_arch }}

      - name: Build Windows or macOS
        if: matrix.platform != 'linux'
        run: wails build -platform ${{ matrix.wails_platform }} -clean

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: wails build -platform ${{ matrix.wails_platform }} -clean -tags webkit2_41

      - name: Build torrent helper
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          Push-Location torrent-helper
          try {
            go build -trimpath -ldflags="-s -w" -o "../build/bin/${{ matrix.helper_binary }}" .
          } finally {
            Pop-Location
          }

      - name: Copy bundled ffmpeg into package
        shell: pwsh
        run: ./scripts/copy-ffmpeg-to-package.ps1 -Platform ${{ matrix.ffmpeg_platform }}

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: |
          cd build/bin
          Compress-Archive -Path *.exe -DestinationPath ../${{ matrix.artifact }}

      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: pwsh
        run: |
          $app = Get-ChildItem build/bin -Directory -Filter *.app | Select-Object -First 1
          if (-not $app) { throw 'Wails app bundle was not produced' }
          Copy-Item build/bin/${{ matrix.helper_binary }} (Join-Path $app.FullName 'Contents/MacOS/${{ matrix.helper_binary }}') -Force
          Push-Location build/bin
          try {
            zip -r ../${{ matrix.artifact }} $app.Name
          } finally {
            Pop-Location
          }

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          cd build/bin
          tar -czf ../${{ matrix.artifact }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: watch-together-*
          merge-multiple: true
          path: release

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
